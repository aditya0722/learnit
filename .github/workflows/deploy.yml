name: Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy tested commit
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-master
      cancel-in-progress: false

    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 root@"$SERVER_HOST" bash -s -- "$DEPLOY_SHA" << 'EOF'
          set -euo pipefail
          deploy_sha="$1"
          cd /root/learnit
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$deploy_sha" ]; then
            echo "Skipping an outdated deployment; master has a newer commit."
            exit 0
          fi
          git reset --hard "$deploy_sha"
          docker compose up -d --build
          EOF
